[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-market"
version = "0.1.0"
description = "A simulator of one made-up hotel market, and an agent that recommends rate changes from its data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "anthropic>=1.11",
    "duckdb>=1.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hotel-market = "hotel_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
